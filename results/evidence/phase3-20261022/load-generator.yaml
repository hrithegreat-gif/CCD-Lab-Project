# Opt-in in-cluster load generator (batch/v1 Job). Not applied by
# scripts/deploy-k3s.sh; run it explicitly for HPA/scaling experiments.
#
# Prerequisites (docs/KUBERNETES.md):
#   kubectl -n ai-serving create configmap k6-script \
#       --from-file=k6-script.js=loadtest/k6-script.js
#   kubectl -n ai-serving apply -f k8s/load-generator.yaml
#
# The Job targets the Service DNS name so traffic is balanced across replicas
# (a Service port-forward pins one Pod and is for smoke checks only).
# It is bounded: defaults 15s warm-up @2VU, 30s baseline @2VU, 180s sustained
# @8VU; VUs capped at 32, sustained duration capped at 600s, and
# activeDeadlineSeconds hard-stops the Job after 15 minutes.
# API_KEY comes from Secret serving-secrets and is never logged or echoed.
apiVersion: batch/v1
kind: Job
metadata:
  name: load-generator
  namespace: ai-serving
  labels:
    app.kubernetes.io/name: load-generator
    app.kubernetes.io/component: loadtest
    app.kubernetes.io/part-of: ai-serving
spec:
  backoffLimit: 0            # never retry a load run (double load distorts results)
  activeDeadlineSeconds: 900 # hard bound even if the script misbehaves
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-generator
        app.kubernetes.io/component: loadtest
        app.kubernetes.io/part-of: ai-serving
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # grafana/k6 runs as uid 12345; the group/fsGroup make the k6-home
        # emptyDir writable so summary.json can be written by the non-root user.
        runAsUser: 12345
        runAsGroup: 12345
        fsGroup: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:1.8.2
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --quiet
            - /scripts/k6-script.js
          env:
            - name: TARGET_URL
              value: http://ai-model-serving.ai-serving.svc.cluster.local:8000
            - name: LOADTEST_VUS
              value: "8"
            - name: LOADTEST_DURATION
              value: 180s
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: serving-secrets
                  key: api-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: k6-home
              mountPath: /home/k6
      volumes:
        - name: script
          configMap:
            name: k6-script
        - name: k6-home
          emptyDir:
            sizeLimit: 16Mi
