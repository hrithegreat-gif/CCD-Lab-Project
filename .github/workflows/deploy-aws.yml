# Manual deployment to the existing AWS lab instance. This workflow NEVER
# applies Terraform, never starts the EC2 instance and never touches other
# environments: it deploys to infrastructure the operator already created.
# Gate: environment aws-demo (approval + OIDC role) AND an enforced API check
# that ci.yml has a successful run for the exact commit before anything runs.
#
# Flow: require green CI -> build + container smoke -> push immutable <sha>
# tag to ECR -> upload deploy/<sha>.tar.gz to S3 -> invoke the SSM deploy
# document (parameters ObjectKey / BundleSha256 / ImageUri) -> poll to Success.
name: deploy-aws

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  build-smoke-push:
    name: Build, smoke, push image
    runs-on: ubuntu-latest
    environment: aws-demo
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
      registry_host: ${{ steps.image.outputs.registry_host }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bounded eventual-consistency retry; fails closed when absent.
          for attempt in 1 2 3; do
            COUNT=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=1" \
              --jq '.total_count')
            if [ "${COUNT}" -ge 1 ]; then
              echo "CI is green for ${GITHUB_SHA}"
              exit 0
            fi
            echo "no successful ci.yml run yet for ${GITHUB_SHA} (attempt ${attempt})"
            sleep 10
          done
          echo "refusing to deploy: no successful ci.yml run for ${GITHUB_SHA}" >&2
          exit 1
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Derive immutable image URI
        id: image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY_HOST="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${REGISTRY_HOST}/${{ vars.ECR_REPOSITORY }}:${GITHUB_SHA}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "registry_host=${REGISTRY_HOST}" >> "$GITHUB_OUTPUT"
          echo "image: ${IMAGE_URI}"
      - name: Build image
        run: docker build --no-cache -t "${{ steps.image.outputs.image_uri }}" .
      - name: Start container in hardened mode (mirrors the k8s runtime)
        run: |
          docker run -d --name ccd-smoke -p 127.0.0.1:8000:8000 \
            --read-only \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            --memory 1g \
            --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001 \
            --tmpfs /cache:rw,noexec,nosuid,size=256m,uid=0,gid=10001,mode=0770 \
            -e MODEL_CACHE_DIR=/cache \
            -e MODEL_LOCAL_FILES_ONLY=true \
            -e BACKGROUND_MODEL_LOAD=true \
            -e MAX_REQUEST_BYTES=65536 \
            -e API_KEY= \
            "${{ steps.image.outputs.image_uri }}"
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/health/ready; then
              echo; exit 0
            fi
            sleep 5
          done
          echo "container never became ready" >&2
          docker logs ccd-smoke >&2 || true
          exit 1
      - name: Non-root verification
        run: '[ "$(docker exec ccd-smoke id -u)" = "10001" ]'
      - name: Real HTTP smoke test against the container
        run: python scripts/smoke_test.py --base-url http://127.0.0.1:8000
      - name: Remove smoke container
        if: always()
        run: docker rm -f ccd-smoke || true
      - name: Log in to ECR (bare registry host)
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ steps.image.outputs.registry_host }}"
      - name: Push immutable commit tag
        run: docker push "${{ steps.image.outputs.image_uri }}"

  upload-bundle:
    name: Upload deploy bundle
    runs-on: ubuntu-latest
    environment: aws-demo
    needs: build-smoke-push
    outputs:
      object_key: ${{ steps.bundle.outputs.object_key }}
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Create deploy bundle (only needed sources; no secrets, git or caches)
        id: bundle
        run: |
          mkdir -p deploy
          tar -czf "deploy/${GITHUB_SHA}.tar.gz" \
            k8s \
            loadtest \
            scripts/deploy-k3s.sh \
            scripts/render_k8s.py \
            scripts/record_scaling.py \
            scripts/entrypoint.sh \
            scripts/smoke_test.py
          SHA256=$(sha256sum "deploy/${GITHUB_SHA}.tar.gz" | cut -d' ' -f1)
          echo "object_key=deploy/${GITHUB_SHA}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          ls -l "deploy/${GITHUB_SHA}.tar.gz"
          if ! echo "$SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "checksum is not 64 lowercase hex" >&2; exit 1
          fi
      - name: Upload bundle to S3
        run: |
          aws s3 cp "deploy/${GITHUB_SHA}.tar.gz" \
            "s3://${{ vars.ARTIFACT_BUCKET }}/${{ steps.bundle.outputs.object_key }}"

  deploy:
    name: Trigger and verify SSM deployment
    runs-on: ubuntu-latest
    environment: aws-demo
    needs: [build-smoke-push, upload-bundle]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Send deploy command to the instance
        id: command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "${{ vars.SSM_DEPLOY_DOCUMENT }}" \
            --targets "Key=InstanceIds,Values=${{ vars.EC2_INSTANCE_ID }}" \
            --comment "ccd-lab deploy ${GITHUB_SHA}" \
            --timeout-seconds 600 \
            --parameters "ObjectKey=${{ needs.upload-bundle.outputs.object_key }},BundleSha256=${{ needs.upload-bundle.outputs.bundle_sha256 }},ImageUri=${{ needs.build-smoke-push.outputs.image_uri }}" \
            --query 'Command.CommandId' --output text)
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM command: ${COMMAND_ID}"
      - name: Wait for the command to finish
        run: |
          COMMAND_ID="${{ steps.command.outputs.command_id }}"
          INSTANCE="${{ vars.EC2_INSTANCE_ID }}"
          FINAL="Timeout"
          fetch_status() {
            # Eventual consistency: InvocationDoesNotExist right after
            # send-command is retried; any other error fails immediately.
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE" \
              --query 'Status' --output text 2>/tmp/ssm-err.txt || true)"
            if [ -n "$(cat /tmp/ssm-err.txt 2>/dev/null || true)" ]; then
              if grep -q "InvocationDoesNotExist" /tmp/ssm-err.txt; then
                echo "Pending"
                return 0
              fi
              echo "aws ssm get-command-invocation failed:" >&2
              cat /tmp/ssm-err.txt >&2
              exit 1
            fi
            echo "$STATUS"
          }
          for i in $(seq 1 60); do
            STATUS=$(fetch_status)
            echo "poll $i: $STATUS"
            case "$STATUS" in
              Success) FINAL="Success"; break ;;
              Pending|InProgress|Delayed) sleep 10 ;;
              *)
                FINAL="$STATUS"
                break ;;
            esac
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE" \
            --query '{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json > command-result.json || true
          echo "--- deployment output (tail) ---"
          python3 - <<'PY'
          import json
          with open("command-result.json", encoding="utf-8") as fh:
              result = json.load(fh)
          print(result.get("Stdout", "")[-4000:])
          print("--- stderr (tail) ---")
          print(result.get("Stderr", "")[-2000:])
          PY
          if [ "$FINAL" != "Success" ]; then
            echo "deployment finished with status: $FINAL" >&2
            exit 1
          fi
      - name: Deployment summary
        run: |
          echo "### Deployed ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "image: \`${{ needs.build-smoke-push.outputs.image_uri }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "bundle: \`s3://${{ vars.ARTIFACT_BUCKET }}/${{ needs.upload-bundle.outputs.object_key }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "SSM command: \`${{ steps.command.outputs.command_id }}\`" >> "$GITHUB_STEP_SUMMARY"
